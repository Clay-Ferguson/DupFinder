[project]
name = "dupfinder"
version = "0.1.0"
description = "Find duplicate files under a folder, with a PyQt6 results window"
requires-python = ">=3.11"
dependencies = [
    "PyQt6>=6.6",
    "PyYAML>=6.0",
    "windowchrome",
]

# `windowchrome` is not on PyPI: it is developed beside this project and
# consumed from the sibling directory. The checkout has to sit next to this
# one — `../windowchrome` — or `uv run` fails with an unresolved path
# dependency. `editable` so an edit there is picked up here with no reinstall.
[tool.uv.sources]
windowchrome = { path = "../windowchrome", editable = true }

# Not an installable package: uv only builds the virtualenv from the
# dependencies above, and start.sh runs the code straight out of the tree.
[tool.uv]
package = false
